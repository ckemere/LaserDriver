# OpenOCD interface config — SWD bit-banged from Raspberry Pi GPIO.
#
# Wiring, Rev 2 HAT (LaserHAT/CLAUDE.md; Rev 1 had 25/24/18):
#   Pi GPIO 24 -> MSPM0 SWCLK (PA20)
#   Pi GPIO 25 -> MSPM0 SWDIO (PA19)
#   Pi GPIO 23 -> MSPM0 NRST  (chip reset)
#
# Pi 4 exposes the SoC GPIO bank as /dev/gpiochip0; Pi 5 exposes it
# as /dev/gpiochip4 via the RP1 I/O controller.  Override the chip
# number with OPENOCD_GPIOCHIP in the Makefile if you're on a Pi 5.
#
# The user running `make flash` must be in the `gpio` group (default
# on Raspberry Pi OS) to access /dev/gpiochip*.

adapter driver linuxgpiod
adapter speed 1000

# Pi 4 (gpiochip0) by default; the Makefile rewrites these via -c
# when OPENOCD_GPIOCHIP is set to something else.
adapter gpio swclk -chip 0 24
adapter gpio swdio -chip 0 25
adapter gpio srst  -chip 0 23

transport select swd

# Use NRST (Pi GPIO 23) for resets, not the cortex_m driver's
# SYSRESETREQ path (which would require SWD to already be working).
# We do NOT use connect_assert_srst here: holding NRST during the
# OpenOCD probe also holds DEBUGSS in reset, which makes MEM-AP
# examination fail.  Instead, `make flash` / laserhat-flash power-cycle
# the MCU via GPIO 18 right before launching openocd, so the probe lands
# in the firmware's ~4 s boot blink.
reset_config srst_only srst_nogate
